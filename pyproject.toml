[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expressive-arm"
version = "0.1.0"
description = "Eight human-choreographed SO-101 expressions, motion data and recording tools"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Meichen Liu (Murphy)"}]
keywords = ["robotics", "human-robot-interaction", "choreography", "SO-101"]
dependencies = []

[project.urls]
Repository = "https://github.com/Muurrphy/expressive-arm"
Demonstrations = "https://muurrphy.github.io/desktop-robot-murphy-demo/expressions/"

[project.scripts]
expressive-arm = "expressive_arm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
expressive_arm = ["motions/*.jsonl", "motions/*.json"]
