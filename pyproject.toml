[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "expressive-arm"
version = "0.3.0b1"
description = "Bipu: a Jev-powered robot pet with recorded SO-101 motions and choreography tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Meichen Liu (Murphy)"}]
keywords = ["robotics", "human-robot-interaction", "choreography", "SO-101", "Jev", "Telegram", "robot-pet"]
dependencies = []

[project.urls]
Repository = "https://github.com/Muurrphy/bipu"
Issues = "https://github.com/Muurrphy/bipu/issues"
Changelog = "https://github.com/Muurrphy/bipu/blob/main/CHANGELOG.md"
Demonstrations = "https://muurrphy.github.io/desktop-robot-murphy-demo/expressions/"

[project.scripts]
expressive-arm = "expressive_arm.cli:main"
bipu = "expressive_arm.bipu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
expressive_arm = ["motions/*.jsonl", "motions/*.json"]

"expressive_arm.bipu" = ["sounds.json", "web.html"]
